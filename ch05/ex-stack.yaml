AWSTemplateFormatVersion: '2010-09-09'
Description: One thing and one policy
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
Resources:
  ExThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Sub '${Key}-ex-stack-sensor'
  ExPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub '${Key}-ex-stack-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: '*'
      Tags:
        - Key: awsbook
          Value: !Ref Key
