AWSTemplateFormatVersion: '2010-09-09'
Description: The first stack of this book
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
Resources:
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Key}-first-topic'
Outputs:
  TopicArn:
    Value: !Ref Topic
