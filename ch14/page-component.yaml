name: awsbook page
description: Installs nginx and writes one page
schemaVersion: 1.0
phases:
  - name: build
    steps:
      - name: InstallNginx
        action: ExecuteBash
        inputs:
          commands:
            - dnf install -y -q nginx
            - echo "<h1>built by Image Builder</h1>" > /usr/share/nginx/html/index.html
            - systemctl enable nginx
  - name: validate
    steps:
      - name: CheckPage
        action: ExecuteBash
        inputs:
          commands:
            - grep -q "built by Image Builder" /usr/share/nginx/html/index.html
  - name: test
    steps:
      - name: NginxRuns
        action: ExecuteBash
        inputs:
          commands:
            - systemctl is-active nginx
