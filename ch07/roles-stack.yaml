AWSTemplateFormatVersion: '2010-09-09'
Description: A role for Lambda with one inline policy
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
Resources:
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Key}-stack-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${Key}-list-buckets'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
      Tags:
        - Key: awsbook
          Value: !Ref Key
Outputs:
  RoleArn:
    Value: !GetAtt ServiceRole.Arn
