AWSTemplateFormatVersion: '2010-09-09'
Description: A Network Load Balancer with a TCP target group and a listener
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  BalancerGroup:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceA:
    Type: AWS::EC2::Instance::Id
  InstanceB:
    Type: AWS::EC2::Instance::Id
Resources:
  Balancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Key}-nlb-stack'
      Type: network
      Scheme: internet-facing
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      SecurityGroups:
        - !Ref BalancerGroup
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Group:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Key}-tcp-stack'
      Protocol: TCP
      Port: 8080
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckProtocol: TCP
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Targets:
        - Id: !Ref InstanceA
          Port: 8080
        - Id: !Ref InstanceB
          Port: 8080
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balancer
      Protocol: TCP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Group
Outputs:
  Dns:
    Value: !GetAtt Balancer.DNSName
