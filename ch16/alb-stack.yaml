AWSTemplateFormatVersion: '2010-09-09'
Description: An Application Load Balancer with a target group, a listener and a rule
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetA:
    Type: AWS::EC2::Subnet::Id
  SubnetB:
    Type: AWS::EC2::Subnet::Id
  BalancerGroup:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceA:
    Type: AWS::EC2::Instance::Id
  InstanceB:
    Type: AWS::EC2::Instance::Id
Resources:
  Balancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Key}-stack-alb'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref SubnetA
        - !Ref SubnetB
      SecurityGroups:
        - !Ref BalancerGroup
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Group:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Key}-stack-web'
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      Targets:
        - Id: !Ref InstanceA
          Port: 8080
        - Id: !Ref InstanceB
          Port: 8080
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Balancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref Group
  StackRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /stack/*
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '200'
            ContentType: text/plain
            MessageBody: the stack rule answered
Outputs:
  Dns:
    Value: !GetAtt Balancer.DNSName
