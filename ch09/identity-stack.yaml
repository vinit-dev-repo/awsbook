AWSTemplateFormatVersion: '2010-09-09'
Description: The identity resources of chapter 9 in one stack
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Key}-stack-pool'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UserPoolTags:
        awsbook: !Ref Key
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${Key}-stack-app'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: !Sub '${Key}-stack-staff'
      Description: staff of the shop
      UserPoolId: !Ref UserPool
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub '${Key}-stack-identity'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref AppClient
          ProviderName: !Sub 'cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
      IdentityPoolTags:
        - Key: awsbook
          Value: !Ref Key
  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Key}-stack-auth'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              ForAnyValue:StringLike:
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: !Sub '${Key}-stack-whoami'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
      Tags:
        - Key: awsbook
          Value: !Ref Key
  RoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthRole.Arn
  GithubProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Analyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Properties:
      AnalyzerName: !Sub '${Key}-stack-analyzer'
      Type: ACCOUNT
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Share:
    Type: AWS::RAM::ResourceShare
    Properties:
      Name: !Sub '${Key}-stack-share'
      AllowExternalPrincipals: false
      Tags:
        - Key: awsbook
          Value: !Ref Key
