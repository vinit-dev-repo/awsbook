AWSTemplateFormatVersion: '2010-09-09'
Description: A network interface with an Elastic IP, attached to an instance
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  GroupId:
    Type: AWS::EC2::SecurityGroup::Id
  InstanceId:
    Type: AWS::EC2::Instance::Id
Resources:
  Card:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SubnetId
      GroupSet:
        - !Ref GroupId
      SecondaryPrivateIpAddressCount: 1
      SourceDestCheck: false
      Description: awsbook-ch12 stack interface
      Tags:
        - Key: Name
          Value: !Sub '${Key}-stack-eni'
        - Key: awsbook
          Value: !Ref Key
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${Key}-stack-eip'
        - Key: awsbook
          Value: !Ref Key
  Association:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt Address.AllocationId
      NetworkInterfaceId: !Ref Card
      PrivateIpAddress: !GetAtt Card.PrimaryPrivateIpAddress
  Attachment:
    Type: AWS::EC2::NetworkInterfaceAttachment
    Properties:
      InstanceId: !Ref InstanceId
      NetworkInterfaceId: !Ref Card
      DeviceIndex: '1'
      DeleteOnTermination: false
