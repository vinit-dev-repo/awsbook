AWSTemplateFormatVersion: '2010-09-09'
Description: An Elastic IP and a network interface
Parameters:
  Key:
    Type: String
    AllowedPattern: '^awsbook-[a-z0-9-]+$'
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  GroupId:
    Type: AWS::EC2::SecurityGroup::Id
Resources:
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: awsbook
          Value: !Ref Key
  Card:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref SubnetId
      GroupSet:
        - !Ref GroupId
      Description: a second interface
      Tags:
        - Key: awsbook
          Value: !Ref Key
